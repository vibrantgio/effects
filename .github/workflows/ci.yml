# Minimal build-and-test CI, added by B3.5 so the ADR-001 layer check has
# somewhere to run.
#
# The layer check fetches scripts/check-layers.sh from the vibrantgio/.github
# repo, which owns the tier table — this repo carries no copy, so the table
# cannot drift per repo.
#
# ADR-006 tag seam: with no workspace in CI, sibling vibrantgio modules
# resolve from the module proxy at published tags. Until the post-refactor
# tags are pushed, this workflow may be red on a fresh clone-and-build; that
# is expected and clears with the next tag push.
#
# F5.4 made the test step verbose and added the golden-image report after it.
# This repository stores golden PNGs, and until F5.4 nothing here could say
# whether CI ever compared them; see the report step for why.
name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Gio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev \
            libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      # F5.7 experiment, pulse only. Everything above is headers: -dev
      # packages let cgo compile against EGL, GLES and Vulkan, and none of
      # them puts an implementation on the runner. So headless.NewWindow has
      # nothing to open, every golden test skips, and F5.4's report has said
      # so on every run.
      #
      # These are the runtime halves, taken from gio's own Linux CI manifest
      # (.builds/linux.yml in the gioui.org module), which installs exactly
      # them so that its own headless tests run: an EGL loader and the mesa
      # EGL/GLX drivers behind it, the DRI drivers that carry llvmpipe for a
      # runner with no GPU, and lavapipe for the Vulkan context gio prefers.
      #
      # Filtered against the archive rather than installed outright, because
      # the list spans releases: mesa-libgallium is a split-out of
      # libgl1-mesa-dri that exists from Ubuntu 24.10, and naming a package
      # ubuntu-latest has never heard of would fail this step and measure
      # nothing. A missing name is reported and stepped over.
      #
      # pulse alone carries this until the experiment reports. Twenty-one
      # goldens is the smallest golden set in the organization and three of
      # them are CPU-rendered, so they compare today and pin the harness
      # itself; whether the other eighteen *match* a Linux renderer is the
      # open question, and the answer decides for prism, cadence and markdown
      # without risking 185 images at once.
      - name: Install the GL drivers the headers do not carry (F5.7)
        run: |
          want="libegl1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri mesa-libgallium libgbm1 mesa-vulkan-drivers"
          have=""
          for p in $want; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              have="$have $p"
            else
              echo "::notice::F5.7: no such package on this runner, stepping over it: $p"
            fi
          done
          echo "installing:$have"
          sudo apt-get install -y $have

      - run: go build ./...

      # -v and the tee are load-bearing, not noise. Every golden harness in
      # the organization answers a failed headless.NewWindow with
      # t.Skipf("... headless rendering not supported ..."), and a skipped
      # test passes — so "CI is green" claimed nothing at all about the
      # stored PNGs. Plain `go test` never prints a skip, which is why no
      # earlier run could be asked either.
      #
      # -count=1 is load-bearing too, and F5.7 found out the hard way.
      # actions/setup-go caches ~/.cache/go-build keyed on go.sum, so the Go
      # test cache survives from run to run — and go test replays a cached
      # run's *output*, skip lines and all. The first push of the drivers
      # below changed no Go file and no go.sum, so every package hit that
      # cache: the whole test step took one second instead of fourteen and
      # faithfully reprinted 36 skips recorded by a runner that had no
      # drivers. A CI test step that can replay an answer from before the
      # machine changed is not measuring the machine.
      - name: Test
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"

      # The verdict is emitted as a workflow annotation and not only as log
      # text, because the two are not equally reachable: downloading a run
      # log needs admin rights on the repository, while annotations are
      # public — GET /repos/vibrantgio/<repo>/commits/<sha>/check-runs
      # returns them to an unauthenticated caller. That is what makes this
      # question answerable from a clone, with curl, by whoever asks next.
      #
      # It reports; it does not gate. Turning the skip into a failure is a
      # separate decision and belongs with its fix: gio's own Linux CI
      # (.builds/linux.yml in the gioui.org module) installs the runtime
      # drivers this workflow does not — libegl-mesa0, libglx-mesa0,
      # libgl1-mesa-dri, mesa-libgallium, libgbm1, libegl1 and
      # mesa-vulkan-drivers. Without them there is no EGL display to
      # initialise and no Vulkan ICD for gio's fallback context to find, and
      # the -dev packages installed above supply headers, not drivers.
      - name: Were the golden images compared, or skipped? (F5.4)
        if: always()
        run: |
          log="$RUNNER_TEMP/test.log"
          if [ ! -f "$log" ]; then
            echo "::warning::golden images: no test log, the test step never ran"
            exit 0
          fi
          headless=$(grep -c 'headless rendering not supported' "$log" || true)
          skipped=$(grep -cE '^[[:space:]]*--- SKIP' "$log" || true)
          passed=$(grep -cE '^[[:space:]]*--- PASS' "$log" || true)
          if [ "$headless" -gt 0 ]; then
            verdict="golden images SKIPPED: $headless test(s) could not open a headless window, so no stored PNG was compared on this runner"
            echo "::warning::$verdict"
          else
            verdict="golden images COMPARED: no test skipped for want of a headless window"
            echo "::notice::$verdict"
          fi
          echo "$verdict"

          # F5.7: and *why* it could not open one. The harness formats the
          # error from headless.NewWindow into its skip message, so the reason
          # is already in the log — which is exactly the place a reader
          # without admin rights cannot look. Without it "SKIPPED" is a dead
          # end: a missing EGL implementation, a missing DRI device and a
          # Vulkan loader with no ICD all read identically. Distinct reasons
          # only, so the annotation stays one line however many tests skipped.
          if [ "$headless" -gt 0 ]; then
            reasons=$(grep -oE 'headless rendering not supported: .*' "$log" | sort -u | paste -sd' | ' -)
            echo "::warning::golden images skipped because: $reasons"
            echo "$reasons"
          fi

          # F5.7: by how much. "The images ran" and "the images match" are
          # different answers, and only the second one lets CI gate on them —
          # every stored PNG in this organization was generated on macOS, so a
          # Linux GL stack rendering them one pixel differently would turn a
          # newly-honest gate into four red repositories. The counts that
          # settle it are in the run log, and a run log needs admin rights on
          # the repository, so they are summed here and published the way the
          # verdict above is: as an annotation, which needs no token at all.
          differed=$(grep -cE 'pixel\(s\) differ' "$log" || true)
          resized=$(grep -c 'size changed: golden is' "$log" || true)
          worst=$(grep -oE '[0-9]+ pixel\(s\) differ' "$log" | awk '$1 > m { m = $1 } END { print m + 0 }')
          sum=$(grep -oE '[0-9]+ pixel\(s\) differ' "$log" | awk '{ s += $1 } END { print s + 0 }')
          if [ "$((differed + resized))" -gt 0 ]; then
            delta="golden images MISMATCHED: $differed by pixel value and $resized by size; $sum pixel(s) differ across them, worst single image $worst"
            echo "::warning::$delta"
          else
            delta="golden images: no stored PNG mismatched"
          fi
          echo "$delta"

          {
            echo "### Golden images (F5.4, F5.7)"
            echo
            echo "$verdict"
            echo
            echo "$delta"
            echo
            echo "| count | |"
            echo "|------:|-|"
            echo "| $headless | skips for want of a headless window |"
            echo "| $skipped | skipped tests, all causes |"
            echo "| $passed | passing tests |"
            echo "| $differed | goldens differing by pixel value |"
            echo "| $resized | goldens differing by size |"
            echo
            grep -E 'golden: "' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Layer check (ADR-001)
        run: |
          curl -fsSL https://raw.githubusercontent.com/vibrantgio/.github/master/scripts/check-layers.sh \
            -o "$RUNNER_TEMP/check-layers.sh"
          bash "$RUNNER_TEMP/check-layers.sh" .
